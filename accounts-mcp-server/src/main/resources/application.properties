spring.application.name=accounts-mcp-server
server.port=${ACCOUNTS_MCP_PORT:8091}

# MCP server (SSE transport via the webmvc starter; default endpoints /sse and /mcp/message).
spring.ai.mcp.server.name=accounts-mcp-server
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.type=SYNC

# The Core Banking API this server's tool calls.
corebank.api.base-url=${COREBANK_API_BASE_URL:http://localhost:8090}
corebank.api.connect-timeout=${COREBANK_API_CONNECT_TIMEOUT:2s}
corebank.api.read-timeout=${COREBANK_API_READ_TIMEOUT:5s}

logging.level.root=warn
logging.level.inc.kodingkrafters=info
