spring.application.name=customer-support-bot

# Load an optional, git-ignored local overrides file (see README.md) so credentials
# never need to be hardcoded here or committed to git. Place it alongside this file
# in src/main/resources/application-local.properties.
spring.config.import=optional:classpath:application-local.properties

# LLM connection. The Spring AI OpenAI-compatible client points at OpenRouter by default;
# every value can be overridden with an environment variable.
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://openrouter.ai/api/v1}
spring.ai.openai.chat.model=${OPENAI_CHAT_MODEL:cohere/north-mini-code:free}
spring.ai.openai.chat.options.temperature=${OPENAI_CHAT_TEMPERATURE:0.5}

# The three MCP servers each specialist agent connects to (SSE). The bot builds its own
# McpSyncClient per server, so the Spring AI MCP client auto-configuration is left off.
spring.ai.mcp.client.enabled=false
mcp.accounts.url=${ACCOUNTS_MCP_URL:http://localhost:8091}
mcp.transaction.url=${TRANSACTION_MCP_URL:http://localhost:8092}
mcp.service.url=${SERVICE_MCP_URL:http://localhost:8093}
mcp.request-timeout=${MCP_REQUEST_TIMEOUT:20s}

server.port=${SERVER_PORT:8080}

# /api/chat rate limiting (per caller IP) — a cap on LLM spend and abuse until real
# authentication lets this be scoped to the authenticated customer instead.
chat.rate-limit.max-requests=${CHAT_RATE_LIMIT_MAX_REQUESTS:20}
chat.rate-limit.window=${CHAT_RATE_LIMIT_WINDOW:1m}

logging.level.root=warn
logging.level.inc.kodingkrafters=info
logging.level.org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor=info
